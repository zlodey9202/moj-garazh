<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Civic 3D Test</title><style>html,body{margin:0;height:100%;background:#101318;color:white;font-family:system-ui;overflow:hidden}#scene{position:absolute;inset:0}header{position:absolute;top:12px;left:12px;right:12px;z-index:2;background:#20242bcc;padding:14px;border-radius:16px}header b{display:block;font-size:18px}header small{opacity:.7}#status{position:absolute;bottom:16px;left:12px;right:12px;text-align:center;color:#ccc;background:#20242bcc;padding:10px;border-radius:12px;z-index:2}button{background:#303640;color:white;border:0;border-radius:12px;padding:10px 14px;margin-top:8px}</style></head><body><div id="scene"></div><header><b>МОЙ ГАРАЖ · 3D тест</b><small>Honda Civic · Collada ZIP</small><br><button onclick="resetView()">Сброс камеры</button></header><div id="status">Загрузка архива…</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">import * as THREE from 'three';import {ColladaLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/ColladaLoader.js';import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';const host=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101318);scene.add(new THREE.HemisphereLight(0xffffff,0x333344,2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(5,8,6);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.5);fill.position.set(-6,4,-4);scene.add(fill);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;let root;window.resetView=()=>{camera.position.set(5,3,7);controls.target.set(0,0,0);controls.update()};async function load(){try{const zip=await JSZip.loadAsync(await (await fetch('./civic-model.zip')).blob());const file=zip.file('civic-model.dae');if(!file)throw Error('DAE не найден в ZIP');const xml=await file.async('text');const loader=new ColladaLoader();const dae=loader.parse(xml,'');root=dae.scene;root.rotation.x=-Math.PI/2;root.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0xc65b18,metalness:.65,roughness:.28});}});scene.add(root);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());root.position.sub(center);const max=Math.max(size.x,size.y,size.z);camera.position.set(max*1.2,max*.7,max*1.5);controls.target.set(0,0,0);camera.near=max/1000;camera.far=max*20;camera.updateProjectionMatrix();controls.update();document.getElementById('status').textContent='Модель загружена · вращай пальцем · pinch для масштаба';}catch(e){document.getElementById('status').textContent='Ошибка: '+e.message;console.error(e)}}load();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>
